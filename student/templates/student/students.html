{% extends 'student/base.html' %}

{% block content %}

<h2 class="mb-4">Student List</h2>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody>

    {% for student in students %}

        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.email }}</td>
        </tr>

    {% empty %}

        <tr>
            <td colspan="4" class="text-center">
                No students found.
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
