{% extends 'student/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Add Student</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save Student
        </button>

        <a href="{% url 'students' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
